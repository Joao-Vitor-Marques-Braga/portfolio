<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdfa"/>
      <stop offset="100%" stop-color="#fbecd6"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#964213"/>
      <stop offset="100%" stop-color="#6e2d09"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#733c14" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="128" height="128" rx="34" fill="url(#bgGrad)" stroke="#dec09d" stroke-width="4"/>

  <!-- Inner subtle glow -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>

  <!-- Monogram JV Stylized -->
  <g filter="url(#shadow)">
    <!-- Letter J -->
    <path d="M 44 38 L 56 38 L 56 76 C 56 86 50 92 38 92 C 32 92 26 90 22 86 L 27 76 C 30 79 33 81 37 81 C 42 81 44 78 44 73 Z" fill="url(#textGrad)"/>
    
    <!-- Letter V -->
    <path d="M 64 38 L 76 38 L 88 77 L 100 38 L 112 38 L 94 90 L 82 90 Z" fill="url(#textGrad)"/>

    <!-- Tech dot / Accent spark -->
    <circle cx="108" cy="85" r="5" fill="#e08a47"/>
  </g>
</svg>

